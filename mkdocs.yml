# Helpmefindthejob — mkdocs-material site config.
#
# Built locally with: `pip install -r requirements-dev.txt && mkdocs build --strict`.
# Auto-deployed to GitHub Pages on every push to main and the working
# branch via `.github/workflows/docs-publish.yml`.
#
# Cross-link rather than duplicate: native pages are the docs/ files
# that already live in the docs tree; ARCHITECTURE / STANDARDS /
# CONTRIBUTING / ROADMAP / CHANGELOG / compliance/ remain canonically
# at the repo root and are linked as external GitHub URLs in the nav
# so a single edit stays authoritative.

site_name: Helpmefindthejob
site_description: >-
  Open-source EU-wide civic employment commons — MCP-composable copilot
  for users facing structural labor-market friction in Europe.
site_url: https://helpmefindthejob.com/
repo_url: https://github.com/maksodf/helpmefindthejob
repo_name: maksodf/helpmefindthejob
edit_uri: edit/main/docs/

# All public-facing planning + content lives under docs/. The grant
# workspace (docs/grant/*) is an internal planning surface and is
# excluded below — it does not belong on the public docs site.
docs_dir: docs

# Files inside docs/ that are internal / operator / audit artefacts and
# should not be published on the public docs site. The pattern syntax is
# gitignore-style.
exclude_docs: |
  grant/
  releases/
  null-handler-audit-2026-05-10.md
  cookie-audit.md
  deferred-test-backlog.md
  incident-playbook.md
  iteration-analytics.md
  support-triage.md
  pilot-runbook.md
  security-review-checklist.md
  threat-model.md
  brand-voice.md
  company-discovery-direct-career-page-search.md

# Compliance pages are sourced from ../compliance/ via individual nav
# entries below — mkdocs reads files anywhere in the build tree as
# long as they appear in nav. The two user-facing compliance docs
# (transparency-notice + deployer-operating-manual) are brought in
# natively for the §3.6 polish-trio slice; other compliance/* files
# remain GitHub-rendered external links per the cross-link convention.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # phase2-backlog #37 (2026-05-22): Stripe-tier docs polish.
    # All flags below are mkdocs-material built-ins — zero new
    # dependencies; pure config upgrade.
    - navigation.tabs
    - navigation.tabs.sticky  # sticky tabs on scroll
    - navigation.top  # scroll-to-top button
    - navigation.tracking  # update URL fragment as you scroll
    - navigation.sections  # render top-level nav as section labels
    - navigation.indexes  # section landing pages from `index.md`
    - navigation.path  # breadcrumbs at top of content
    - navigation.instant  # SPA-style page loading (Stripe-fast)
    - navigation.instant.progress  # progress bar during instant nav
    - navigation.footer  # prev / next links at page bottom
    - search.suggest  # autocomplete-as-you-type
    - search.highlight  # highlight result in opened page
    - search.share  # shareable deep-link search URLs
    - content.code.copy  # copy-to-clipboard on code blocks
    - content.code.annotate  # numbered annotations inside code
    - content.tabs.link  # cross-page tab sync (Python/Curl/JS)
    - content.action.edit  # "edit this page" links (uses edit_uri)
    - content.action.view  # "view source" links
    - content.tooltips  # rich tooltips on abbreviations + footnotes
    - toc.follow  # ToC scrolls with the page
    - header.autohide  # hide header on scroll (Stripe-style)
    - announce.dismiss  # X to dismiss the announcement bar

extra_css:
  - stylesheets/accessibility.css

extra_javascript:
  - javascripts/accessibility.js

hooks:
  - docs/hooks/compliance_mirror.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - def_list
  - md_in_html
  - abbr
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: maksodf
      repo: helpmefindthejob
  - pymdownx.critic
  - pymdownx.betterem

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maksodf/helpmefindthejob
      name: Helpmefindthejob on GitHub
  generator: false
  # phase2-backlog #37: announcement bar — surfaces the
  # operator's call to action without intruding on content.
  # Empty / commented in default build; uncomment + populate
  # at deployment time when there's something to announce
  # (release, NLnet submission, demo deploy, etc.).
  # announcement: |
  #   <strong>v0.2.0 shipped</strong> — see
  #   <a href="/changelog/">changelog</a> for what's new.
  status:
    new: New surface
    deprecated: Deprecated

nav:
  - Home: index.md
  - Quickstart: https://github.com/maksodf/helpmefindthejob#quickstart
  - Architecture: https://github.com/maksodf/helpmefindthejob/blob/main/ARCHITECTURE.md
  - Standards: https://github.com/maksodf/helpmefindthejob/blob/main/STANDARDS.md
  - Accessibility: https://github.com/maksodf/helpmefindthejob/blob/main/ACCESSIBILITY.md
  - MCP API: mcp-server.md
  - Deployment:
      - Generic recipe: deployment-recipe.md
      - Production: production-deployment.md
  - ESCO + EURES: esco-integration.md
  - Compliance:
      - Overview (GitHub): https://github.com/maksodf/helpmefindthejob/tree/main/compliance
      - Transparency notice: compliance/transparency-notice.md
      - Deployer operating manual: compliance/deployer-operating-manual.md
  - Contributing:
      - Guide (GitHub): https://github.com/maksodf/helpmefindthejob/blob/main/CONTRIBUTING.md
      - Translating: translating.md
  - Roadmap: https://github.com/maksodf/helpmefindthejob/blob/main/ROADMAP.md
  - Sustainability: https://github.com/maksodf/helpmefindthejob/blob/main/SUSTAINABILITY.md
  - Changelog: https://github.com/maksodf/helpmefindthejob/blob/main/CHANGELOG.md
