# Unit-test workflow — multi-OS, multi-Python matrix.
#
# Runs the full unittest suite on Ubuntu, macOS, and Windows across
# the supported Python versions. The MCP integration end-to-end test
# is also exercised here (it doesn't have a separate per-OS workflow).
#
# Why include Windows: contributors on Windows have historically had
# Path / encoding / line-ending surprises. Verifying on every push
# keeps the surprise window short. If a specific test is genuinely
# Linux/macOS-only it should use ``@unittest.skipIf(sys.platform == "win32")``
# rather than being silently broken on Windows.
#
# Security note: no untrusted GitHub event payload fields (issue
# titles, PR bodies, commit messages, head refs, etc.) flow into any
# ``run:`` step. Only static matrix values are interpolated.

name: tests

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        # The 3.9 row on macos-latest is excluded because the runner
        # image ships 3.9 in a way that conflicts with setup-python's
        # macOS arm64 cache strategy. macOS coverage comes from 3.12;
        # 3.9 coverage comes from ubuntu-latest (and windows-latest).
        exclude:
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        # Cross-platform install command — pip handles per-OS wheel
        # selection automatically.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: i18n parity check
        run: python -m unittest tests.test_phase0_i18n_parity
