# Unit-test workflow — Ubuntu × Python 3.9 + 3.12 matrix.
#
# Cross-platform coverage (macOS + Windows) was attempted on the
# §3.2 push (commit 95c0ab7). Both platforms surfaced pre-existing
# Linux-isms across the test suite that require systematic
# remediation before the matrix can broaden:
#
#   * Windows: many tests open files without an explicit
#     ``encoding="utf-8"`` argument, defaulting to cp1252 on Windows
#     runners and producing ResourceWarnings + ERROR cascades on
#     i18n parity, encryption-at-rest, rate limits, and operator
#     package tests.
#   * macOS: subprocess-based HTTP smoke tests (``test_app_smoke``,
#     ``test_http_admin_extras``, ``test_http_phase2``) time out in
#     ``setUpClass`` with ``RuntimeError: server did not start``
#     due to a slower TCP-bind cycle on macOS GitHub runners.
#
# Both issues are tracked as Phase 2 cleanup work (see
# ``docs/grant/03-post-grant.md``). The current matrix matches the
# pre-§3.2 scope (Ubuntu only) while the cross-platform debt is
# being paid down incrementally.
#
# Security note: no untrusted GitHub event payload fields (issue
# titles, PR bodies, commit messages, head refs, etc.) flow into any
# ``run:`` step. Only static matrix values are interpolated.

name: tests

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        # Cross-platform install command — pip handles per-OS wheel
        # selection automatically.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: i18n parity check
        run: python -m unittest tests.test_phase0_i18n_parity
