# OpenSSF Scorecard workflow.
#
# Generates an automated security-best-practices score for the
# repository on a weekly cadence and on every push to main. Findings
# are published to the GitHub Security tab and (when publish_results
# is on) to the OpenSSF project's public dashboard, making them
# visible to NLnet reviewers and to deployers evaluating the project.
#
# Security note: no untrusted GitHub event payload fields (issue
# titles, PR bodies, commit messages, head refs, etc.) flow into any
# step argument. The workflow runs the ossf/scorecard-action and
# uploads the SARIF result; no shell interpolation of user-controlled
# data.

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360  # v3.35.5
        with:
          sarif_file: results.sarif
