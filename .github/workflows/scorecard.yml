# OpenSSF Scorecard workflow.
#
# Generates an automated security-best-practices score for the
# repository on a weekly cadence and on every push to main. Findings
# are published to the GitHub Security tab and (when publish_results
# is on) to the OpenSSF project's public dashboard, making them
# visible to NLnet reviewers and to deployers evaluating the project.
#
# Security note: no untrusted GitHub event payload fields (issue
# titles, PR bodies, commit messages, head refs, etc.) flow into any
# step argument. The workflow runs the ossf/scorecard-action and
# uploads the SARIF result; no shell interpolation of user-controlled
# data.

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
