# Pre-commit hooks for the DirectJob Scout project.
#
# Setup once after cloning:
#     pip install -r requirements-dev.txt
#     pre-commit install
#
# The pre-commit hook runs on every `git commit`. Heavyweight checks
# (mypy, the full test suite) stay in CI rather than pre-commit so
# the local commit loop remains fast. Config for ruff and codespell
# lives in pyproject.toml.

repos:
  - repo: local
    hooks:
      - id: spdx-header-check
        name: Check SPDX-License-Identifier header on Python files
        entry: python3 scripts/check_spdx_headers.py
        language: system
        files: \.py$
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: Ruff lint
        args: ["--fix"]
      - id: ruff-format
        name: Ruff format-check
        args: ["--check"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        name: Codespell — find typos
        additional_dependencies:
          - tomli
