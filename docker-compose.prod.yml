name: helpmefindthejob

services:
  helpmefindthejob:
    image: helpmefindthejob:latest
    build: .
    expose:
      - "8765"
    environment:
      HELPMEFINDTHEJOB_ENV: production
      HELPMEFINDTHEJOB_DATA_DIR: /app/data
      HELPMEFINDTHEJOB_HOST: 0.0.0.0
      HELPMEFINDTHEJOB_PORT: 8765
      HELPMEFINDTHEJOB_SECRET_KEY: ${HELPMEFINDTHEJOB_SECRET_KEY:?set HELPMEFINDTHEJOB_SECRET_KEY}
      HELPMEFINDTHEJOB_AUDIT_SALT: ${HELPMEFINDTHEJOB_AUDIT_SALT:?set HELPMEFINDTHEJOB_AUDIT_SALT (32 random bytes base64; production refuses to start without it)}
      HELPMEFINDTHEJOB_DOMAIN: ${HELPMEFINDTHEJOB_DOMAIN:?set HELPMEFINDTHEJOB_DOMAIN (e.g. demo.helpmefindthejob.org)}
      HELPMEFINDTHEJOB_HSTS: ${HELPMEFINDTHEJOB_HSTS:-1}
      HELPMEFINDTHEJOB_ADMIN_EMAIL: ${HELPMEFINDTHEJOB_ADMIN_EMAIL:?set HELPMEFINDTHEJOB_ADMIN_EMAIL}
      HELPMEFINDTHEJOB_ADMIN_PASSWORD: ${HELPMEFINDTHEJOB_ADMIN_PASSWORD:?set HELPMEFINDTHEJOB_ADMIN_PASSWORD}
      HELPMEFINDTHEJOB_COOKIE_SECURE: "true"
      # 2026-05-23 (UX-P0 follow-up): default flipped to `true` to
      # match the code-level default (app.py:865). The civic-commons
      # mission requires open public sign-up; operators who want a
      # closed-pilot deployment set HELPMEFINDTHEJOB_ALLOW_REGISTRATION=false
      # explicitly in .env. Pre-fix this compose default overrode
      # the code default, silently leaving prod with sign-up closed.
      HELPMEFINDTHEJOB_ALLOW_REGISTRATION: ${HELPMEFINDTHEJOB_ALLOW_REGISTRATION:-true}
      HELPMEFINDTHEJOB_PUBLIC_URL: ${HELPMEFINDTHEJOB_PUBLIC_URL:-}
      HELPMEFINDTHEJOB_EMAIL_BACKEND: ${HELPMEFINDTHEJOB_EMAIL_BACKEND:-console}
      HELPMEFINDTHEJOB_SMTP_HOST: ${HELPMEFINDTHEJOB_SMTP_HOST:-}
      HELPMEFINDTHEJOB_SMTP_PORT: ${HELPMEFINDTHEJOB_SMTP_PORT:-587}
      HELPMEFINDTHEJOB_SMTP_USERNAME: ${HELPMEFINDTHEJOB_SMTP_USERNAME:-}
      HELPMEFINDTHEJOB_SMTP_PASSWORD: ${HELPMEFINDTHEJOB_SMTP_PASSWORD:-}
      HELPMEFINDTHEJOB_SMTP_STARTTLS: ${HELPMEFINDTHEJOB_SMTP_STARTTLS:-true}
      HELPMEFINDTHEJOB_EMAIL_FROM: ${HELPMEFINDTHEJOB_EMAIL_FROM:-}
      HELPMEFINDTHEJOB_QUOTA_SCANS_PER_DAY: ${HELPMEFINDTHEJOB_QUOTA_SCANS_PER_DAY:-50}
      HELPMEFINDTHEJOB_QUOTA_AI_PER_DAY: ${HELPMEFINDTHEJOB_QUOTA_AI_PER_DAY:-50}
      HELPMEFINDTHEJOB_QUOTA_DOMAIN_PER_HOUR: ${HELPMEFINDTHEJOB_QUOTA_DOMAIN_PER_HOUR:-30}
      HELPMEFINDTHEJOB_QUOTA_ACTIVE_SCANS: ${HELPMEFINDTHEJOB_QUOTA_ACTIVE_SCANS:-3}
      HELPMEFINDTHEJOB_BILLING_BACKEND: ${HELPMEFINDTHEJOB_BILLING_BACKEND:-manual}
      HELPMEFINDTHEJOB_STRIPE_API_KEY: ${HELPMEFINDTHEJOB_STRIPE_API_KEY:-}
      HELPMEFINDTHEJOB_STRIPE_PRICE_TEAM: ${HELPMEFINDTHEJOB_STRIPE_PRICE_TEAM:-}
      HELPMEFINDTHEJOB_STRIPE_PRICE_ORG: ${HELPMEFINDTHEJOB_STRIPE_PRICE_ORG:-}
      HELPMEFINDTHEJOB_STRIPE_SUCCESS_URL: ${HELPMEFINDTHEJOB_STRIPE_SUCCESS_URL:-}
      HELPMEFINDTHEJOB_STRIPE_CANCEL_URL: ${HELPMEFINDTHEJOB_STRIPE_CANCEL_URL:-}
      HELPMEFINDTHEJOB_BACKUP_BACKEND: ${HELPMEFINDTHEJOB_BACKUP_BACKEND:-local}
      HELPMEFINDTHEJOB_BACKUP_REMOTE: ${HELPMEFINDTHEJOB_BACKUP_REMOTE:-}
      HELPMEFINDTHEJOB_MONITORING_URL: ${HELPMEFINDTHEJOB_MONITORING_URL:-}
      HELPMEFINDTHEJOB_LOG_TARGET: ${HELPMEFINDTHEJOB_LOG_TARGET:-}
      HELPMEFINDTHEJOB_LEGAL_REVIEWED: ${HELPMEFINDTHEJOB_LEGAL_REVIEWED:-false}
      HELPMEFINDTHEJOB_VAPID_PUBLIC_KEY: ${HELPMEFINDTHEJOB_VAPID_PUBLIC_KEY:-}
      HELPMEFINDTHEJOB_VAPID_PRIVATE_KEY: ${HELPMEFINDTHEJOB_VAPID_PRIVATE_KEY:-}
      HELPMEFINDTHEJOB_VAPID_CONTACT: ${HELPMEFINDTHEJOB_VAPID_CONTACT:-mailto:admin@helpmefindthejob.org}
      HELPMEFINDTHEJOB_BRAVE_API_KEY: ${HELPMEFINDTHEJOB_BRAVE_API_KEY:-}
      HELPMEFINDTHEJOB_ADZUNA_APP_ID: ${HELPMEFINDTHEJOB_ADZUNA_APP_ID:-}
      HELPMEFINDTHEJOB_ADZUNA_APP_KEY: ${HELPMEFINDTHEJOB_ADZUNA_APP_KEY:-}
      HELPMEFINDTHEJOB_ADZUNA_COUNTRY: ${HELPMEFINDTHEJOB_ADZUNA_COUNTRY:-de}
      HELPMEFINDTHEJOB_STRIPE_WEBHOOK_SECRET: ${HELPMEFINDTHEJOB_STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - helpmefindthejob_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    depends_on:
      - helpmefindthejob
    ports:
      - "80:80"
      - "443:443"
    environment:
      HELPMEFINDTHEJOB_DOMAIN: ${HELPMEFINDTHEJOB_DOMAIN:?set HELPMEFINDTHEJOB_DOMAIN}
      HELPMEFINDTHEJOB_ADMIN_EMAIL: ${HELPMEFINDTHEJOB_ADMIN_EMAIL:?set HELPMEFINDTHEJOB_ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  helpmefindthejob_data:
  caddy_data:
  caddy_config:
