name: directjob-scout

services:
  directjob-scout:
    image: directjob-scout:latest
    build: .
    expose:
      - "8765"
    environment:
      COMPANY_DISCOVERY_ENV: production
      COMPANY_DISCOVERY_DATA_DIR: /app/data
      COMPANY_DISCOVERY_HOST: 0.0.0.0
      COMPANY_DISCOVERY_PORT: 8765
      DIRECTJOB_SECRET_KEY: ${DIRECTJOB_SECRET_KEY:?set DIRECTJOB_SECRET_KEY}
      DIRECTJOB_ADMIN_EMAIL: ${DIRECTJOB_ADMIN_EMAIL:?set DIRECTJOB_ADMIN_EMAIL}
      DIRECTJOB_ADMIN_PASSWORD: ${DIRECTJOB_ADMIN_PASSWORD:?set DIRECTJOB_ADMIN_PASSWORD}
      DIRECTJOB_COOKIE_SECURE: "true"
      DIRECTJOB_ALLOW_REGISTRATION: ${DIRECTJOB_ALLOW_REGISTRATION:-false}
      DIRECTJOB_PUBLIC_URL: ${DIRECTJOB_PUBLIC_URL:-}
      DIRECTJOB_EMAIL_BACKEND: ${DIRECTJOB_EMAIL_BACKEND:-console}
      DIRECTJOB_SMTP_HOST: ${DIRECTJOB_SMTP_HOST:-}
      DIRECTJOB_SMTP_PORT: ${DIRECTJOB_SMTP_PORT:-587}
      DIRECTJOB_SMTP_USERNAME: ${DIRECTJOB_SMTP_USERNAME:-}
      DIRECTJOB_SMTP_PASSWORD: ${DIRECTJOB_SMTP_PASSWORD:-}
      DIRECTJOB_SMTP_STARTTLS: ${DIRECTJOB_SMTP_STARTTLS:-true}
      DIRECTJOB_EMAIL_FROM: ${DIRECTJOB_EMAIL_FROM:-}
      DIRECTJOB_QUOTA_SCANS_PER_DAY: ${DIRECTJOB_QUOTA_SCANS_PER_DAY:-50}
      DIRECTJOB_QUOTA_AI_PER_DAY: ${DIRECTJOB_QUOTA_AI_PER_DAY:-50}
      DIRECTJOB_QUOTA_DOMAIN_PER_HOUR: ${DIRECTJOB_QUOTA_DOMAIN_PER_HOUR:-30}
      DIRECTJOB_QUOTA_ACTIVE_SCANS: ${DIRECTJOB_QUOTA_ACTIVE_SCANS:-3}
      DIRECTJOB_BILLING_BACKEND: ${DIRECTJOB_BILLING_BACKEND:-manual}
      DIRECTJOB_STRIPE_API_KEY: ${DIRECTJOB_STRIPE_API_KEY:-}
      DIRECTJOB_STRIPE_PRICE_TEAM: ${DIRECTJOB_STRIPE_PRICE_TEAM:-}
      DIRECTJOB_STRIPE_PRICE_ORG: ${DIRECTJOB_STRIPE_PRICE_ORG:-}
      DIRECTJOB_STRIPE_SUCCESS_URL: ${DIRECTJOB_STRIPE_SUCCESS_URL:-}
      DIRECTJOB_STRIPE_CANCEL_URL: ${DIRECTJOB_STRIPE_CANCEL_URL:-}
      DIRECTJOB_BACKUP_BACKEND: ${DIRECTJOB_BACKUP_BACKEND:-local}
      DIRECTJOB_BACKUP_REMOTE: ${DIRECTJOB_BACKUP_REMOTE:-}
      DIRECTJOB_MONITORING_URL: ${DIRECTJOB_MONITORING_URL:-}
      DIRECTJOB_LOG_TARGET: ${DIRECTJOB_LOG_TARGET:-}
      DIRECTJOB_LEGAL_REVIEWED: ${DIRECTJOB_LEGAL_REVIEWED:-false}
      DIRECTJOB_VAPID_PUBLIC_KEY: ${DIRECTJOB_VAPID_PUBLIC_KEY:-}
      DIRECTJOB_VAPID_PRIVATE_KEY: ${DIRECTJOB_VAPID_PRIVATE_KEY:-}
      DIRECTJOB_VAPID_CONTACT: ${DIRECTJOB_VAPID_CONTACT:-mailto:admin@directjob-scout.example}
      DIRECTJOB_BRAVE_API_KEY: ${DIRECTJOB_BRAVE_API_KEY:-}
      DIRECTJOB_ADZUNA_APP_ID: ${DIRECTJOB_ADZUNA_APP_ID:-}
      DIRECTJOB_ADZUNA_APP_KEY: ${DIRECTJOB_ADZUNA_APP_KEY:-}
      DIRECTJOB_ADZUNA_COUNTRY: ${DIRECTJOB_ADZUNA_COUNTRY:-de}
      DIRECTJOB_STRIPE_WEBHOOK_SECRET: ${DIRECTJOB_STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - directjob_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    depends_on:
      - directjob-scout
    ports:
      - "80:80"
      - "443:443"
    environment:
      DIRECTJOB_DOMAIN: ${DIRECTJOB_DOMAIN:?set DIRECTJOB_DOMAIN}
      DIRECTJOB_ADMIN_EMAIL: ${DIRECTJOB_ADMIN_EMAIL:?set DIRECTJOB_ADMIN_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  directjob_data:
  caddy_data:
  caddy_config:
