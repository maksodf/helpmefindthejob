<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="djs-bg" x1="20" y1="20" x2="172" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4a32c4"/>
    </linearGradient>
    <linearGradient id="djs-stroke" x1="48" y1="48" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e7e0ff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#djs-bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="6" y="6" width="180" height="180" rx="40" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <!-- Stylised "D" wordmark with an integrated upward-right arrow -->
  <!-- D-curve -->
  <path d="M58 48 H96 a48 48 0 0 1 0 96 H58 V48 z" fill="none" stroke="url(#djs-stroke)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Inner dot inside the D, suggesting a target -->
  <circle cx="100" cy="96" r="9" fill="url(#djs-stroke)"/>
  <!-- Bonus arrow piercing the upper-right (the "scout outward" idea) -->
  <path d="M126 78 L150 54 M134 54 L150 54 L150 70" fill="none" stroke="url(#djs-stroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
