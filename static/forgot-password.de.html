  <body class="legal-body">
    <a class="skip-link" href="#mainContent">Zum Hauptinhalt springen</a>
    <main id="mainContent" class="legal-page">
      <header>
        <a href="/" class="legal-back">&larr; Zur&uuml;ck zu Helpmefindthejob</a>
        <p class="language-switcher" aria-label="Sprache w&auml;hlen"><a href="?lang=en" lang="en" hreflang="en">English</a><span aria-hidden="true"> &middot; </span><a href="?lang=de" lang="de" hreflang="de" aria-current="true">Deutsch</a></p>
        <h1>Passwort vergessen?</h1>
        <p class="muted">Geben Sie die E-Mail-Adresse Ihres Kontos ein. Wenn ein passendes Konto existiert, senden wir einen Link zum Zur&uuml;cksetzen, der eine Stunde g&uuml;ltig ist.</p>
      </header>

      <section>
        <form id="forgotPasswordForm" novalidate
              data-err-empty="Bitte geben Sie Ihre E-Mail-Adresse ein."
              data-err-rate-limited="Zu viele Reset-Anfragen. Bitte warten Sie einige Minuten und versuchen Sie es erneut."
              data-err-network="Die Reset-Anfrage konnte nicht gesendet werden. Bitte versuchen Sie es erneut."
              data-msg-sent="Wenn ein passendes Konto existiert, wurde ein Reset-Link gesendet. Pr&uuml;fen Sie Ihren Posteingang (und Spam-Ordner) auf eine Nachricht von no-reply@helpmefindthejob.org.">
          <label class="field" for="forgotEmail">
            <span>E-Mail</span>
            <input id="forgotEmail" name="email" type="email" autocomplete="email" required aria-required="true" />
          </label>
          <div class="action-group">
            <button class="btn btn-primary" type="submit">Reset-Link senden</button>
            <a class="btn" href="/">Zur&uuml;ck zur Anmeldung</a>
          </div>
        </form>
        <p id="forgotPasswordMessage" class="auth-meta" role="status" aria-live="polite"></p>
        <noscript>
          <p class="auth-meta">JavaScript ist erforderlich, um dieses Formular von dieser Seite abzusenden. Sie k&ouml;nnen den Reset auch &uuml;ber die Anmeldeseite der App auf <a href="/">helpmefindthejob.org</a> anfordern.</p>
        </noscript>
      </section>
    </main>
    <script src="/forgot-password.js" defer></script>
