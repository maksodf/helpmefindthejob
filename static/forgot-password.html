<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Forgot password — Helpmefindthejob</title>
    <meta name="description" content="Request a password reset link for your Helpmefindthejob account." />
    <link rel="alternate" hreflang="en" href="https://helpmefindthejob.org/forgot-password" />
    <link rel="alternate" hreflang="de" href="https://helpmefindthejob.org/forgot-password" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forgot password — Helpmefindthejob" />
    <meta property="og:description" content="Request a password reset link for your Helpmefindthejob account." />
    <meta property="og:url" content="https://helpmefindthejob.org/forgot-password" />
    <meta property="og:site_name" content="Helpmefindthejob" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://helpmefindthejob.org/"},
        {"@type": "ListItem", "position": 2, "name": "Forgot password", "item": "https://helpmefindthejob.org/forgot-password"}
      ]
    }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.min.css" />
  </head>
  <body class="legal-body">
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <main id="mainContent" class="legal-page">
      <header>
        <a href="/" class="legal-back">&larr; Back to Helpmefindthejob</a>
        <p class="language-switcher" aria-label="Choose language"><a href="?lang=en" lang="en" hreflang="en" aria-current="true">English</a><span aria-hidden="true"> &middot; </span><a href="?lang=de" lang="de" hreflang="de">Deutsch</a></p>
        <h1>Forgot your password?</h1>
        <p class="muted">Enter the email associated with your account. If a matching account exists, we&rsquo;ll send a reset link that expires in one hour.</p>
      </header>

      <section>
        <form id="forgotPasswordForm" novalidate
              data-err-empty="Please enter your email."
              data-err-rate-limited="Too many reset requests. Please wait a few minutes and try again."
              data-err-network="Could not send the reset request. Please try again."
              data-msg-sent="If a matching account exists, a reset link has been sent. Check your inbox (and spam folder) for a message from no-reply@helpmefindthejob.org.">
          <label class="field" for="forgotEmail">
            <span>Email</span>
            <input id="forgotEmail" name="email" type="email" autocomplete="email" required aria-required="true" />
          </label>
          <div class="action-group">
            <button class="btn btn-primary" type="submit">Send reset link</button>
            <a class="btn" href="/">Back to sign in</a>
          </div>
        </form>
        <p id="forgotPasswordMessage" class="auth-meta" role="status" aria-live="polite"></p>
        <noscript>
          <p class="auth-meta">JavaScript is required to submit this form from this page. You can also request a reset from the in-app sign-in screen at <a href="/">helpmefindthejob.org</a>.</p>
        </noscript>
      </section>
    </main>
    <script src="/forgot-password.js" defer></script>
  </body>
</html>
